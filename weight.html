<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 引入 vchart 文件 -->
    <script src="https://unpkg.com/@visactor/vchart/build/index.min.js"></script>
  </head>
  <body>
    <div id="chart" style="width: 100%;height:400px;"></div>
  </body>

  <script>
    /**
     * 解析 'YYYY-MM-DD' 为本地时区的 Date（避免 new Date(string) 的 UTC 偏移问题）
     */
    function parseDate(str) {
      const [y, m, d] = String(str).split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    /**
     * 往前推一个月（自动处理 3/31 -> 2/28 这类月末越界）
     */
    function subOneMonth(date) {
      const d = new Date(date.getTime());
      const day = d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() - 1);
      const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, daysInMonth));
      return d;
    }

    /**
     * 获取 [当前时间往前一个月 00:00:00, 当前时间 23:59:59.999] 的区间
     */
    function getLastMonthRange() {
      const now = new Date();
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      const start = subOneMonth(now);
      start.setHours(0, 0, 0, 0);
      return { start, end };
    }

    /**
     * 读取 data.json
     */
    async function loadJsonData(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    (async function init() {
      const chartDom = document.getElementById('chart');
      try {
        // 1. 获取 JSON 数据
        const json = await loadJsonData('./data.json');
        const rawValues = Array.isArray(json) ? json : (json.values || []);

        // 2. 计算时间区间并过滤
        const { start, end } = getLastMonthRange();
        const values = rawValues
          .filter(item => {
            const t = parseDate(item.month).getTime();
            return t >= start.getTime() && t <= end.getTime();
          })
          .sort((a, b) => parseDate(a.month) - parseDate(b.month));

        // 3. 渲染图表
        const spec = {
          data: [{ id: 'barData', values }],
          type: 'line',
          xField: 'month',
          yField: 'sales',
		  title: {
			text: '一月体重数据',      // 主标题
			subtext: '数据来源：内部统计', // 副标题（可选）
			align: 'center'           // 对齐方式：'left' | 'center' | 'right'
		  },
          tooltip: {
            mark: {
              content: [
                { key: '日期', value: 'month' },
                { key: '数值', value: 'sales' }
              ]
            }
          }
        };

        const vchart = new VChart.default(spec, { dom: 'chart' });
        vchart.renderSync();
      } catch (err) {
        console.error(err);
        chartDom.innerHTML =
          '数据加载失败：' + err.message +
          '<br/>请通过本地服务器（如 npx serve / python -m http.server）打开本页面，直接双击 file:// 打开会被浏览器 CORS 策略拦截。';
      }
    })();
  </script>
</html>
