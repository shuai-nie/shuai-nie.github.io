<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据看板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f0f2f8;
      color: #2d2d3a;
      display: flex;
      overflow: hidden;
    }

    /* ============ 左侧菜单栏 ============ */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      height: 100vh;
      background: linear-gradient(180deg, #2d2b55 0%, #3d3a6b 100%);
      display: flex;
      flex-direction: column;
      color: #fff;
      position: relative;
      z-index: 2;
      box-shadow: 4px 0 20px rgba(45, 43, 85, 0.15);
    }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b9cff, #c084fc);
      box-shadow: 0 0 12px rgba(139, 156, 255, 0.8);
    }

    .sidebar-header p {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
    }

    .menu {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.22s ease;
      user-select: none;
      position: relative;
    }

    .menu-item .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-item .icon svg { width: 100%; height: 100%; }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transform: translateX(3px);
    }

    .menu-item.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      box-shadow: 0 6px 18px rgba(102, 126, 234, 0.45);
    }

    .menu-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: #fff;
      border-radius: 0 3px 3px 0;
    }

    .sidebar-footer {
      padding: 16px 24px 22px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 0.5px;
    }

    /* ============ 右侧内容区 ============ */
    .main {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f0f2f8;
      position: relative;
    }

    .topbar {
      height: 56px;
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid #e6e8f0;
      display: flex;
      align-items: center;
      padding: 0 26px;
      gap: 10px;
    }

    .topbar .page-title {
      font-size: 15px;
      font-weight: 600;
      color: #2d2d3a;
    }

    .topbar .breadcrumb {
      font-size: 12px;
      color: #9a9ab0;
      margin-left: auto;
    }

    .content {
      flex: 1;
      padding: 20px;
      min-height: 0;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(45, 43, 85, 0.06);
    }

    /* ============ 小屏适配 ============ */
    @media (max-width: 720px) {
      .sidebar { width: 64px; }
      .sidebar-header h1 span:not(.logo-dot),
      .sidebar-header p,
      .sidebar-footer,
      .menu-item span.text { display: none; }
      .sidebar-header {
        padding: 22px 0;
        text-align: center;
      }
      .sidebar-header h1 { justify-content: center; }
      .menu-item {
        justify-content: center;
        padding: 13px 0;
      }
      .menu-item:hover { transform: none; }
      .content { padding: 12px; }
    }
  </style>
</head>
<body>
  <!-- ============ 左侧菜单 ============ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>
        <span class="logo-dot"></span>
        <span>数据看板</span>
      </h1>
      <p>DATA DASHBOARD</p>
    </div>

    <nav class="menu">
      <div class="menu-item active" data-page="/weight.html" data-title="体重折线图">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M7 15l4-5 3 3 5-7"/>
          </svg>
        </span>
        <span class="text">体重折线图</span>
      </div>

      <div class="menu-item" data-page="/attendance.html" data-title="考勤记录">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
            <path d="M9 16l2 2 4-4"/>
          </svg>
        </span>
        <span class="text">考勤记录</span>
      </div>

      <!-- 新增：工作记录 -->
      <div class="menu-item" data-page="/task.html" data-title="工作记录">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </span>
        <span class="text">工作记录</span>
      </div>
    </nav>

    <div class="sidebar-footer">© 2026 数据看板</div>
  </aside>

  <!-- ============ 右侧内容区 ============ -->
  <main class="main">
    <div class="topbar">
      <span class="page-title" id="pageTitle">体重折线图</span>
      <span class="breadcrumb">首页 / <span id="breadcrumb">体重折线图</span></span>
    </div>

    <div class="content">
      <iframe id="contentFrame" src="/weight.html" title="内容区"></iframe>
    </div>
  </main>

  <script>
    const frame      = document.getElementById('contentFrame');
    const pageTitle  = document.getElementById('pageTitle');
    const breadcrumb = document.getElementById('breadcrumb');
    const items      = document.querySelectorAll('.menu-item');

    items.forEach(item => {
      item.addEventListener('click', () => {
        if (item.classList.contains('active')) return;

        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const page  = item.dataset.page;
        const title = item.dataset.title;
        frame.src = page;
        pageTitle.textContent  = title;
        breadcrumb.textContent = title;
      });
    });
  </script>
</body>
</html>
